<svg xmlns="http://www.w3.org/2000/svg" width="760" height="618" viewBox="0 0 760 618" role="img" aria-labelledby="title desc">
  <title id="title">From a draft to the agent’s startup index</title>
  <desc id="desc">The agent drafts a note with a quote from committed Git source. If review approves it, Truthiness saves it; otherwise it stays pending. At startup, Truthiness rechecks saved notes against the current source revision. Notes with matching quotes can appear in the index. Stale notes are hidden.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#8B93A0"/>
    </marker>
  </defs>
  <rect width="760" height="618" rx="24" fill="#0E1116"/>
  <g fill="#151A21" stroke="#2A313B" stroke-width="2">
    <rect x="34" y="24" width="692" height="88" rx="14"/>
    <rect x="34" y="145" width="422" height="105" rx="14"/>
    <rect x="490" y="145" width="236" height="105" rx="14"/>
    <rect x="34" y="283" width="422" height="65" rx="14"/>
    <rect x="34" y="381" width="692" height="92" rx="14"/>
    <rect x="34" y="520" width="327" height="76" rx="14"/>
    <rect x="399" y="520" width="327" height="76" rx="14"/>
  </g>
  <g fill="none" stroke="#8B93A0" stroke-width="3" marker-end="url(#arrow)">
    <path d="M245 112v30"/>
    <path d="M456 198h31"/>
    <path d="M245 250v30"/>
    <path d="M245 348v30"/>
    <path d="M380 473v22H198v22"/>
    <path d="M380 473v22h182v22"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#F2EFE8" font-size="33" font-weight="700">
    <text x="380" y="62">1. Draft a note</text>
    <text x="245" y="189">2. Review the evidence</text>
    <text x="608" y="189" fill="#F0883E">Pending</text>
    <text x="245" y="327" fill="#56D364">Save to the store</text>
    <text x="380" y="420">3. Recheck at startup</text>
    <text x="198" y="555" fill="#56D364">Eligible for index</text>
    <text x="562" y="555" fill="#F0883E">Hide stale note</text>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#B0B9C5" font-size="29">
    <text x="380" y="96">Claim + quote from committed code</text>
    <text x="245" y="226">Exact quote or reviewer</text>
    <text x="608" y="226">Not approved</text>
    <text x="380" y="455">Compare quotes with current Git source</text>
    <text x="198" y="584" font-size="25">Quote still matches</text>
    <text x="562" y="584" font-size="25">Quote no longer matches</text>
  </g>
</svg>
